server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # This server sits behind a TLS-terminating proxy and only ever sees http,
  # so an absolute Location header would downgrade the scheme: a request for
  # /desarrollo turned into https -> http -> https, three hops with an
  # insecure one in the middle, on every sitemap URL. Relative redirects keep
  # whatever scheme the client actually used.
  absolute_redirect off;

  # Security headers live in a snippet included by every location; see
  # nginx-security-headers.conf for why they can't sit here.
  include /etc/nginx/snippets/security-headers.conf;

  # Branded error pages (src/pages/404.astro, src/pages/500.astro). Without
  # these, nginx answered unknown URLs with its bare default page.
  error_page 404 /404.html;
  error_page 500 502 503 504 /500.html;

  location = /404.html {
    internal;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  location = /500.html {
    internal;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Fingerprinted Astro build assets.
  location ^~ /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    try_files $uri =404;
  }

  # Legacy and folder URLs; see nginx-redirects.conf.
  include /etc/nginx/snippets/redirects.conf;

  # Non-fingerprinted static assets from /public.
  location ~* \.(?:png|jpe?g|webp|gif|avif|svg|ico|woff2?|ttf|otf|eot)$ {
    add_header Cache-Control "public, max-age=2592000, must-revalidate" always;
    include /etc/nginx/snippets/security-headers.conf;
    expires 30d;
    try_files $uri =404;
  }

  # Manifest should refresh faster than static icons.
  location = /site.webmanifest {
    add_header Cache-Control "public, max-age=86400, must-revalidate" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # HTML must revalidate frequently.
  location ~* \.html$ {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    include /etc/nginx/snippets/security-headers.conf;
    expires -1;
    try_files $uri =404;
  }

  # Route handling for static Astro output.
  location / {
    try_files $uri $uri/ $uri.html =404;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    include /etc/nginx/snippets/security-headers.conf;
  }
}
