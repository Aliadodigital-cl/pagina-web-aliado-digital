# Included in every location of nginx.conf. nginx drops server-level
# add_header directives in any location that declares its own add_header, so
# these must be repeated per location or they silently disappear.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
