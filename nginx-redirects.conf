# Permanent redirects for URLs that existed before or that point at folders
# without an index page. Included in the server block of nginx.conf (Docker)
# and scripts/start-nginx.sh (Nixpacks). Google Search Console reported these
# as 404/403; a 301 hands their ranking to the current page.

# Legacy Linktree URL.
location = /linktree { return 301 /enlace/; }
location = /linktree/ { return 301 /enlace/; }

# Folders with no index.html: nginx answered 403.
location = /servicios { return 301 /#servicios; }
location = /servicios/ { return 301 /#servicios; }
location = /blog/categoria { return 301 /blog/; }
location = /blog/categoria/ { return 301 /blog/; }

# Old blog pagination (/blog/1, /blog/2...), listed in the old sitemap.
location ~ ^/blog/[0-9]+/?$ { return 301 /blog/; }

# Old blog categories, renamed in src/data/blog.ts.
location ~ ^/blog/categoria/legal/?$ { return 301 /blog/categoria/datos-personales/; }
location ~ ^/blog/categoria/marketing/?$ { return 301 /blog/categoria/marketing-digital/; }
location ~ ^/blog/categoria/(desarrollo-web|automatizacion|casos)/?$ { return 301 /blog/; }

# Posts from the old blog (Strapi era) that still get impressions in Search
# Console, sent to the closest current page.
location ~ ^/blog/automatizar-whatsapp/?$ { return 301 /servicios/sistema-gestion-negocio/; }
location ~ ^/blog/performance-landing/?$ { return 301 /servicios/web-estatica/; }

# Old feed location.
location = /rss.xml { return 301 /blog/rss.xml; }
